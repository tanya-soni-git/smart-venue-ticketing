{% extends "base.html" %}
{% block content %}
<form class="row g-2 mb-4" method="GET">
  <div class="col-md-4"><input class="form-control" name="city" placeholder="Filter by City" value="{{ request.args.get('city', '') }}"></div>
  <div class="col-md-4"><input class="form-control" name="category" placeholder="Filter by Category" value="{{ request.args.get('category', '') }}"></div>
  <div class="col-md-4"><button class="btn btn-primary w-100">Search Events</button></div>
</form>
<div class="row">
  {% for ev in events %}
  <div class="col-md-4 mb-3">
    <div class="card h-100 p-3">
      <span class="badge bg-secondary mb-2 w-25">{{ ev.status }}</span>
      <h5>{{ ev.title }}</h5>
      <p class="text-muted mb-1">{{ ev.venue.name }}, {{ ev.venue.city }}</p>
      <p class="small">{{ ev.event_datetime.strftime('%d %b %Y, %I:%M %p') }}</p>
      <a href="{{ url_for('main.event_detail', event_id=ev.id) }}" class="btn btn-outline-primary mt-auto">Select Seats</a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
